sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml,frontend/mobile/shared/build/reports/kover/report.xml,frontend/mobile/shared/build/reports/kover/xml/report.xml
