sonar.projectKey=alandovskis_mobilispect
sonar.organization=alandovskis
sonar.projectName=Mobilispect
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/kotlin,frontend/web/src
sonar.tests=backend/src/test/kotlin
sonar.test.inclusions=**/*Test.kt,**/*Tests.kt,**/*.spec.ts
sonar.exclusions=**/build/**,**/dist/**,**/node_modules/**,**/iosApp/**,**/schemas/**,**/generated/**

sonar.javascript.lcov.reportPaths=frontend/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/web/coverage/lcov.info
sonar.junit.reportPaths=backend/build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
