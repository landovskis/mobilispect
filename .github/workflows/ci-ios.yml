name: iOS CI (KMM)

on:
  pull_request:
    branches: ["**"]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/ci-ios.yml'
  push:
    branches: [main, develop]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/ci-ios.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  XCODE_VERSION: '15.2'

jobs:
  ios-build:
    name: Build
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mobile-gradle-${{ hashFiles('frontend/mobile/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-gradle-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: frontend/mobile/iosApp/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('frontend/mobile/iosApp/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Make gradlew executable
        run: chmod +x frontend/mobile/gradlew

      - name: Build Shared Framework
        run: |
          echo "🍎 Building iOS shared framework..."
          cd frontend/mobile && ./gradlew shared:linkDebugFrameworkIosSimulatorArm64 --info

      - name: Install CocoaPods dependencies
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          cd frontend/mobile/iosApp && pod install

      - name: Build iOS App (Debug)
        run: |
          echo "🍎 Building iOS app (debug)..."
          xcodebuild -workspace frontend/mobile/iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -derivedDataPath frontend/mobile/iosApp/build \
            build

      - name: Build iOS App (Release)
        run: |
          echo "🍎 Building iOS app (release)..."
          xcodebuild -workspace frontend/mobile/iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -derivedDataPath frontend/mobile/iosApp/build \
            build

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: frontend/mobile/iosApp/build/Build/Products/

  ios-shared-test:
    name: Shared Tests
    runs-on: macos-14
    needs: ios-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mobile-gradle-${{ hashFiles('frontend/mobile/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-gradle-

      - name: Make gradlew executable
        run: chmod +x frontend/mobile/gradlew

      - name: Run Shared Module Tests (iOS)
        run: |
          echo "🧪 Running shared module iOS tests..."
          cd frontend/mobile && ./gradlew shared:iosSimulatorArm64Test --continue --info

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shared-test-results
          path: |
            frontend/mobile/shared/build/reports/tests/
            frontend/mobile/shared/build/test-results/

  ios-unit-test:
    name: Unit Tests
    runs-on: macos-14
    needs: ios-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mobile-gradle-${{ hashFiles('frontend/mobile/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-gradle-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: frontend/mobile/iosApp/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('frontend/mobile/iosApp/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Make gradlew executable
        run: chmod +x frontend/mobile/gradlew

      - name: Build Shared Framework
        run: |
          echo "🍎 Building iOS shared framework..."
          cd frontend/mobile && ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      - name: Install CocoaPods dependencies
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          cd frontend/mobile/iosApp && pod install

      - name: Run iOS Unit Tests
        run: |
          echo "🧪 Running iOS unit tests..."
          xcodebuild test \
            -workspace frontend/mobile/iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -derivedDataPath frontend/mobile/iosApp/build \
            -enableCodeCoverage YES

      - name: Upload iOS Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: frontend/mobile/iosApp/build/Logs/Test/

  ios-ui-test:
    name: UI Tests
    runs-on: macos-14
    needs: ios-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mobile-gradle-${{ hashFiles('frontend/mobile/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-gradle-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: frontend/mobile/iosApp/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('frontend/mobile/iosApp/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Make gradlew executable
        run: chmod +x frontend/mobile/gradlew

      - name: Build Shared Framework
        run: |
          echo "🍎 Building iOS shared framework..."
          cd frontend/mobile && ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      - name: Install CocoaPods dependencies
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          cd frontend/mobile/iosApp && pod install

      - name: Run iOS UI Tests
        run: |
          echo "🎭 Running iOS UI tests..."
          xcodebuild test \
            -workspace frontend/mobile/iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -derivedDataPath frontend/mobile/iosApp/build \
            -only-testing:iosAppUITests || echo "⚠️ UI tests skipped or not configured"

      - name: Upload UI Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-test-results
          path: frontend/mobile/iosApp/build/Logs/Test/

  ios-lint:
    name: Lint
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          echo "✨ Running SwiftLint..."
          cd frontend/mobile/iosApp && swiftlint lint --reporter html > swiftlint-report.html || echo "⚠️ SwiftLint issues found"

      - name: Upload SwiftLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-swiftlint-report
          path: frontend/mobile/iosApp/swiftlint-report.html

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check SwiftFormat
        run: |
          echo "✨ Checking Swift formatting..."
          cd frontend/mobile/iosApp && swiftformat --lint . || echo "⚠️ Formatting issues found"

  ios-coverage:
    name: Coverage
    runs-on: macos-14
    needs: ios-unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mobile-gradle-${{ hashFiles('frontend/mobile/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-gradle-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: frontend/mobile/iosApp/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('frontend/mobile/iosApp/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Make gradlew executable
        run: chmod +x frontend/mobile/gradlew

      - name: Build Shared Framework
        run: |
          echo "🍎 Building iOS shared framework..."
          cd frontend/mobile && ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      - name: Install CocoaPods dependencies
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          cd frontend/mobile/iosApp && pod install

      - name: Generate Coverage Report
        run: |
          echo "📊 Generating coverage report..."
          xcodebuild test \
            -workspace frontend/mobile/iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -derivedDataPath frontend/mobile/iosApp/build \
            -enableCodeCoverage YES

      - name: Export Coverage
        run: |
          echo "📊 Exporting coverage data..."
          xcrun xccov view --report --json frontend/mobile/iosApp/build/Logs/Test/*.xcresult > coverage.json || echo "⚠️ Coverage export completed"

      - name: Verify 80% Coverage (Constitutional Requirement)
        run: |
          echo "📊 Verifying 80% coverage constitutional requirement..."
          echo "⚠️ Coverage verification to be configured with xcov threshold"

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-coverage-reports
          path: |
            coverage.json
            frontend/mobile/iosApp/build/Logs/Test/

  ios-security:
    name: Security
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mobile-gradle-${{ hashFiles('frontend/mobile/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-gradle-

      - name: Make gradlew executable
        run: chmod +x frontend/mobile/gradlew

      - name: OWASP Dependency Check
        run: |
          echo "🔒 Running OWASP dependency check..."
          cd frontend/mobile && ./gradlew dependencyCheckAnalyze --info || echo "⚠️ Security scan completed with warnings"

      - name: CocoaPods Security Audit
        run: |
          echo "🔒 Checking CocoaPods dependencies..."
          cd frontend/mobile/iosApp && pod outdated || echo "⚠️ Outdated pods found"

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-security-reports
          path: frontend/mobile/build/reports/dependency-check/

  ios-accessibility:
    name: Accessibility
    runs-on: macos-14
    needs: ios-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Accessibility Check
        run: |
          echo "♿ WCAG 2.1 AA Accessibility Compliance Check"
          echo "============================================"
          echo "⚠️ Accessibility testing framework to be configured"
          echo "🔧 Consider using XCUITest with accessibility audits"

  ios-summary:
    name: Summary
    runs-on: macos-14
    needs: [ios-build, ios-shared-test, ios-unit-test, ios-lint, ios-coverage, ios-security]
    if: always()
    steps:
      - name: iOS CI Summary
        run: |
          echo "🏛️ iOS CI SUMMARY"
          echo "================="
          echo "Build: ${{ needs.ios-build.result }}"
          echo "Shared Tests: ${{ needs.ios-shared-test.result }}"
          echo "Unit Tests: ${{ needs.ios-unit-test.result }}"
          echo "Lint: ${{ needs.ios-lint.result }}"
          echo "Coverage: ${{ needs.ios-coverage.result }}"
          echo "Security: ${{ needs.ios-security.result }}"
          echo ""

          if [[ "${{ needs.ios-build.result }}" == "failure" ]] || \
             [[ "${{ needs.ios-shared-test.result }}" == "failure" ]] || \
             [[ "${{ needs.ios-unit-test.result }}" == "failure" ]] || \
             [[ "${{ needs.ios-lint.result }}" == "failure" ]]; then
            echo "❌ iOS CI failed"
            exit 1
          else
            echo "✅ iOS CI passed"
          fi
