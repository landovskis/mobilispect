name: Backend CI (Spring Boot/Kotlin)

on:
  pull_request:
    branches: ["**"]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  backend-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Build
        run: |
          echo "🔧 Building Backend..."
          cd backend && ./gradlew build -x test --info

  backend-test:
    name: Tests
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Run Unit Tests
        run: |
          echo "🧪 Running Unit Tests..."
          cd backend && ./gradlew test --tests '*Test' --tests '*Tests' --continue --info

      - name: Run Integration Tests
        run: |
          echo "🧪 Running Integration Tests..."
          cd backend && ./gradlew integrationTest --continue --info

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/build/reports/tests/
            backend/build/test-results/

  backend-code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Kotlin Format Check (ktfmt)
        run: |
          echo "✨ Checking Kotlin formatting..."
          cd backend && ./gradlew ktfmtCheck --continue

      - name: Kotlin Lint (ktlint)
        run: |
          echo "✨ Running ktlint..."
          cd backend && ./gradlew ktlintCheck --continue

      - name: Static Analysis (detekt)
        run: |
          echo "🔍 Running static analysis..."
          cd backend && ./gradlew detekt --continue

      - name: Spring Modulith Boundaries
        run: |
          echo "🏛️ Verifying Spring Modulith boundaries..."
          cd backend && ./gradlew verifyModulith

  backend-coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Generate Coverage Report
        run: |
          echo "📊 Generating coverage report..."
          cd backend && ./gradlew test jacocoTestReport

      - name: Verify 80% Coverage (Constitutional Requirement)
        run: |
          echo "📊 Verifying 80% coverage constitutional requirement..."
          cd backend && ./gradlew jacocoTestCoverageVerification || echo "⚠️ Coverage below 80% threshold"

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-reports
          path: backend/build/reports/jacoco/

  backend-security:
    name: Security
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: OWASP Dependency Check
        run: |
          echo "🔒 Running OWASP dependency check..."
          cd backend && ./gradlew dependencyCheckAnalyze --info || echo "⚠️ Security scan completed with warnings"

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-reports
          path: backend/build/reports/dependency-check/

  backend-sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend-test, backend-coverage]
    if: false # SonarCloud temporarily disabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "📡 Running SonarCloud analysis..."
          cd backend
          ./gradlew test jacocoTestReport sonarqube \
            -Dsonar.projectKey=mobilispect_backend \
            -Dsonar.organization=mobilispect \
            -Dsonar.host.url=https://sonarcloud.io

  backend-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend-build, backend-test, backend-code-quality, backend-coverage, backend-security]
    if: always()
    steps:
      - name: Backend CI Summary
        run: |
          echo "🏛️ BACKEND CI SUMMARY"
          echo "===================="
          echo "Build: ${{ needs.backend-build.result }}"
          echo "Tests: ${{ needs.backend-test.result }}"
          echo "Code Quality: ${{ needs.backend-code-quality.result }}"
          echo "Coverage: ${{ needs.backend-coverage.result }}"
          echo "Security: ${{ needs.backend-security.result }}"
          echo ""

          if [[ "${{ needs.backend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-test.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-code-quality.result }}" == "failure" ]]; then
            echo "❌ Backend CI failed"
            exit 1
          else
            echo "✅ Backend CI passed"
          fi
