name: Angular CI (Frontend Web)

on:
  pull_request:
    branches: ["**"]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/ci-angular.yml'
  push:
    branches: [main, develop]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/ci-angular.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'

jobs:
  angular-format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Check Formatting (Prettier)
        run: cd frontend/web && npx prettier --check "src/**/*.{ts,html,css,scss}"

  angular-lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: angular-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Run ESLint
        run: |
          if node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('frontend/web/angular.json'));const hasLint=cfg?.projects?.web?.architect?.lint;process.exit(hasLint?0:1)"; then
            cd frontend/web && npx ng lint
          else
            echo "⚠️ No Angular lint target configured; skipping."
          fi

  angular-build:
    name: Build
    runs-on: ubuntu-latest
    needs: angular-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Build Development
        run: cd frontend/web && npm run build

      - name: Build Production
        run: cd frontend/web && npm run build:prod

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: frontend/web/dist/

  angular-test:
    name: Tests
    runs-on: ubuntu-latest
    needs: angular-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Run Unit Tests
        run: cd frontend/web && npm run test:coverage

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-test-results
          path: |
            frontend/web/coverage/

  angular-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: angular-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Install Playwright Browsers
        run: cd frontend/web && npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E Tests
        run: cd frontend/web && npm run e2e

      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-e2e-results
          path: |
            frontend/web/playwright-report/
            frontend/web/test-results/
