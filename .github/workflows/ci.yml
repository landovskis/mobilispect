name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --profile ci
  wasm-lint:
    name: WASM Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/corridor_builder_web
      - name: Check formatting
        run: cargo fmt --check --manifest-path crates/corridor_builder_web/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/corridor_builder_web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build
        run: cd crates/corridor_builder_web && trunk build
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest
        # If taiki-e/install-action fails to find a binary,
        # replace with: cargo install cargo-mutants --locked && cargo install cargo-nextest --locked
      - name: Compute PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff origin/"$BASE_REF"...HEAD > /tmp/pr.diff
      - name: Check for Rust changes
        id: rust_changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff origin/"$BASE_REF"...HEAD --name-only | grep -q '\.rs$'; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run mutation tests
        if: steps.rust_changes.outputs.has_rust == 'true'
        run: cargo mutants --in-diff /tmp/pr.diff --timeout 300 --jobs 1 --test-tool nextest -- --profile ci
      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-out
          path: mutants.out/
          retention-days: 7
