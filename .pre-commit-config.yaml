# Mobilispect Pre-Commit Configuration
# Enforces Constitutional Quality Gates (Constitution v1.2.0)

repos:
  # Universal checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: 'frontend/web/.*\.json$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  # Kotlin Backend
  - repo: local
    hooks:
      # Backend Kotlin Tests (Constitutional Requirement)
      - id: backend-kotlin-tests
        name: Backend Kotlin Tests (Constitutional TDD Requirement)
        entry: bash -c 'cd backend && ./gradlew test'
        language: system
        files: 'backend/.*\.(kt|kts)$'
        exclude: 'backend/(build|\.gradle)/.*'
        pass_filenames: false

      # Backend Kotlin Formatting
      - id: backend-kotlin-format
        name: Backend Kotlin Format (ktfmt)
        entry: bash -c 'cd backend && ./gradlew ktfmtFormat'
        language: system
        files: 'backend/.*\.kt$'
        exclude: 'backend/(build|\.gradle)/.*'
        pass_filenames: false

      # Backend Kotlin Linting
      - id: backend-kotlin-lint
        name: Backend Kotlin Lint (ktlint)
        entry: bash -c 'cd backend && ./gradlew ktlintCheck'
        language: system
        files: 'backend/.*\.kt$'
        exclude: 'backend/(build|\.gradle)/.*'
        pass_filenames: false

      # Backend Kotlin Static Analysis
      - id: backend-kotlin-detekt
        name: Backend Kotlin Static Analysis (detekt)
        entry: bash -c 'cd backend && ./gradlew detekt'
        language: system
        files: 'backend/.*\.kt$'
        exclude: 'backend/(build|\.gradle)/.*'
        pass_filenames: false

  # Mobile KMM
  - repo: local
    hooks:
      # Mobile KMM Tests (Constitutional Requirement)
      - id: mobile-kotlin-tests
        name: Mobile KMM Tests (Constitutional TDD Requirement)
        entry: bash -c 'cd frontend/mobile && ./gradlew shared:testDebugUnitTest'
        language: system
        files: 'frontend/mobile/.*\.(kt|swift)$'
        exclude: 'frontend/mobile/(build|\.gradle)/.*'
        pass_filenames: false
        stages: [manual]

      # Mobile KMM Formatting
      - id: mobile-kotlin-format
        name: Mobile KMM Format (ktfmt)
        entry: bash -c 'cd frontend/mobile && ./gradlew ktfmtFormat'
        language: system
        files: 'frontend/mobile/.*\.kt$'
        exclude: 'frontend/mobile/(build|\.gradle)/.*'
        pass_filenames: false
        stages: [manual]

      # Mobile KMM Linting
      - id: mobile-kotlin-lint
        name: Mobile KMM Lint (ktlint)
        entry: bash -c 'cd frontend/mobile && ./gradlew ktlintCheck'
        language: system
        files: 'frontend/mobile/.*\.kt$'
        exclude: 'frontend/mobile/(build|\.gradle)/.*'
        pass_filenames: false
        stages: [manual]

  # Security Scans (Constitutional Requirement)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*package-lock\.json$|
            .*\.lock$|
            .*Test\.kt$|
            .*test\.kt$|
            .*env\.yaml\.sample$|
            .*schemas/.*\.json$|
            .*\.sample\.properties$|
            \.github/create-transit-land\.sh$|
            .*TransitLandConfigRepository\.kt$
          )$

  - repo: local
    hooks:
      # OWASP Dependency Check
      - id: owasp-dependency-check
        name: OWASP Dependency Check (Constitutional Security Requirement)
        entry: bash -c './scripts/security-scan.sh'
        language: system
        files: '(backend|frontend/mobile)/.*\.(gradle|json|pom\.xml)$'
        pass_filenames: false

      # Test Coverage Validation (Constitutional 80% Requirement)
      - id: test-coverage-validation
        name: Test Coverage Validation (Constitutional 80% minimum)
        entry: bash -c './scripts/validate-coverage.sh'
        language: system
        files: '.*\.(kt|ts|swift)$'
        pass_filenames: false

      # Constitution Compliance Check
      - id: constitution-compliance
        name: Constitution Compliance Check
        entry: bash -c 'echo "✓ Constitutional quality gates enforced" && echo "✓ DRY/YAGNI/SOLID principles required" && echo "✓ TDD mandatory (tests run above)" && echo "✓ Cross-platform UX consistency required" && echo "✓ Performance standards - 200ms API, 60fps mobile" && echo "✓ ADR documentation required for architectural decisions"'
        language: system
        always_run: true
        pass_filenames: false

  # Documentation Checks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        files: '.*\.md$'
        args: [--fix]

# Configuration
fail_fast: true
default_stages: [pre-commit]

# Exclusions
exclude: |
  (?x)^(
      \.specify/.*|
      \.claude/.*|
      .*/(build|dist|node_modules|\.gradle)/.*|
      .*\.(min\.(js|css)|bundle\.(js|css))$|
      .*\.generated\.(kt|swift|ts)$
  )$
