# Mobilispect Pre-Commit Configuration
# Enforces Constitutional Quality Gates (Constitution v1.2.0)

repos:
  # Universal checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: 'frontend/web/.*\.json$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  # Router hooks to delegate to project configs
  - repo: local
    hooks:
      - id: backend-hooks
        name: Backend Hooks (delegated)
        entry: bash -c 'cd backend && pre-commit run --config .pre-commit-config.yaml'
        language: system
        files: '^backend/'
        pass_filenames: false
      - id: mobile-hooks
        name: Mobile Hooks (delegated)
        entry: bash -c 'cd frontend/mobile && pre-commit run --config .pre-commit-config.yaml'
        language: system
        files: '^frontend/mobile/'
        pass_filenames: false

  # Security Scans (Constitutional Requirement)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*package-lock\.json$|
            .*\.lock$|
            .*Test\.kt$|
            .*test\.kt$|
            .*env\.yaml\.sample$|
            .*schemas/.*\.json$|
            .*\.sample\.properties$|
            \.github/create-transit-land\.sh$|
            .*TransitLandConfigRepository\.kt$
          )$

  - repo: local
    hooks:
      # OWASP Dependency Check
      - id: owasp-dependency-check
        name: OWASP Dependency Check (Constitutional Security Requirement)
        entry: bash -c './scripts/security-scan.sh'
        language: system
        files: '(backend|frontend/mobile)/.*\.(gradle|json|pom\.xml)$'
        pass_filenames: false

      # Test Coverage Validation (Constitutional 80% Requirement)
      - id: test-coverage-validation
        name: Test Coverage Validation (Constitutional 80% minimum)
        entry: bash -c './scripts/validate-coverage.sh'
        language: system
        files: '.*\.(kt|ts|swift)$'
        pass_filenames: false

      # Constitution Compliance Check
      - id: constitution-compliance
        name: Constitution Compliance Check
        entry: bash -c 'echo "✓ Constitutional quality gates enforced (v1.10.0)" && echo "✓ DRY/YAGNI/SOLID principles required" && echo "✓ TDD mandatory (tests run above)" && echo "✓ Cross-platform UX consistency required" && echo "✓ Performance standards - 200ms API, 60fps mobile" && echo "✓ ADR documentation required for architectural decisions" && echo "✓ Modular Monolith Architecture (Spring Modulith verified above)"'
        language: system
        always_run: true
        pass_filenames: false

  # Documentation Checks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        files: '.*\.md$'
        args: [--fix]

# Configuration
fail_fast: true
default_stages: [pre-commit]

# Exclusions
exclude: |
  (?x)^(
      \.specify/.*|
      \.claude/.*|
      \.codex/.*|
      .*/(build|dist|node_modules|\.gradle)/.*|
      .*\.(min\.(js|css)|bundle\.(js|css))$|
      .*\.generated\.(kt|swift|ts)$
  )$
