version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces:cached
      - gradle-cache:/workspaces/.gradle-user-home
    command: sleep infinity
    environment:
      JAVA_HOME: /usr/lib/jvm/msopenjdk-current
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mobilispect
      DB_USER: mobilispect
      DB_PASSWORD: mobilispect
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobilispect
      POSTGRES_USER: mobilispect
      POSTGRES_PASSWORD: mobilispect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilispect"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gradle-cache:
  postgres-data:
