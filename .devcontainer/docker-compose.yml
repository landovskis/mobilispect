services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces:cached
      - gradle-cache:/workspaces/.gradle-user-home
    command: sleep infinity
    environment:
      JAVA_HOME: /usr/lib/jvm/msopenjdk-current
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mobilispect
      DB_USER: mobilispect
      DB_PASSWORD: mobilispect
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobilispect
      POSTGRES_USER: mobilispect
      POSTGRES_PASSWORD: mobilispect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilispect"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.1.7
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:${AIRFLOW_ADMIN_PASSWORD}" # pragma: allowlist secret
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      PYTHONPATH: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      MOBILISPECT_TRANSITLAND_API_KEY: ${MOBILISPECT_TRANSITLAND_API_KEY}
      MOBILISPECT_GTFS_STORAGE_ROOT: /var/lib/mobilispect/gtfs
      MOBILISPECT_DATABASE_URL: postgresql+psycopg2://${MOBILISPECT_DB_USER}:${MOBILISPECT_DB_PASSWORD}@${MOBILISPECT_DB_HOST}:${MOBILISPECT_DB_PORT}/${MOBILISPECT_DB_NAME}
      AIRFLOW_DB_HOST: postgres
      AIRFLOW_DB_PORT: "5432"
      AIRFLOW_DB_NAME: airflow
      AIRFLOW_DB_USER: airflow
      AIRFLOW_DB_PASSWORD: airflow
      MOBILISPECT_DB_HOST: postgres
      MOBILISPECT_DB_PORT: "5432"
      MOBILISPECT_DB_NAME: mobilispect
      MOBILISPECT_DB_USER: airflow
      MOBILISPECT_DB_PASSWORD: airflow
    volumes:
      - ..:/workspaces:cached
      - ../airflow/dags:/opt/airflow/dags:cached
      - ../airflow/pipeline:/opt/airflow/pipeline:cached
      - gtfs-data:/var/lib/mobilispect/gtfs
    ports:
      - "8081:8080"
    command:
      [
        "bash",
        "-lc",
        "printf '{\"%s\":\"%s\"}\\n' \"$AIRFLOW_ADMIN_USER\" \"$AIRFLOW_ADMIN_PASSWORD\" > /opt/airflow/simple_auth_manager_passwords.json && chmod 600 /opt/airflow/simple_auth_manager_passwords.json && pip install --no-cache-dir -r /workspaces/backend/airflow/requirements.txt && airflow api-server --host 0.0.0.0 --port 8080 & airflow scheduler & airflow dag-processor"
      ]

  airflow-init:
    image: apache/airflow:3.1.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:${AIRFLOW_ADMIN_PASSWORD}" # pragma: allowlist secret
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      PYTHONPATH: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      MOBILISPECT_TRANSITLAND_API_KEY: ${MOBILISPECT_TRANSITLAND_API_KEY}
      MOBILISPECT_GTFS_STORAGE_ROOT: /var/lib/mobilispect/gtfs
      MOBILISPECT_DATABASE_URL: postgresql+psycopg2://${MOBILISPECT_DB_USER}:${MOBILISPECT_DB_PASSWORD}@${MOBILISPECT_DB_HOST}:${MOBILISPECT_DB_PORT}/${MOBILISPECT_DB_NAME}
      AIRFLOW_DB_HOST: postgres
      AIRFLOW_DB_PORT: "5432"
      AIRFLOW_DB_NAME: airflow
      AIRFLOW_DB_USER: airflow
      AIRFLOW_DB_PASSWORD: airflow
      MOBILISPECT_DB_HOST: postgres
      MOBILISPECT_DB_PORT: "5432"
      MOBILISPECT_DB_NAME: mobilispect
      MOBILISPECT_DB_USER: airflow
      MOBILISPECT_DB_PASSWORD: airflow
    volumes:
      - ..:/workspaces:cached
      - ../airflow/dags:/opt/airflow/dags:cached
      - ../airflow/pipeline:/opt/airflow/pipeline:cached
      - gtfs-data:/var/lib/mobilispect/gtfs
    command:
      [
        "bash",
        "-lc",
        "printf '{\"%s\":\"%s\"}\\n' \"$AIRFLOW_ADMIN_USER\" \"$AIRFLOW_ADMIN_PASSWORD\" > /opt/airflow/simple_auth_manager_passwords.json && chmod 600 /opt/airflow/simple_auth_manager_passwords.json && pip install --no-cache-dir -r /workspaces/backend/airflow/requirements.txt && for i in $(seq 1 30); do airflow db migrate && break; echo \"waiting for airflow db\"; sleep 2; done"
      ]

volumes:
  gradle-cache:
  postgres-data:
  airflow-postgres-data:
  gtfs-data:
