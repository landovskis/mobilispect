services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces:cached
      - gradle-cache:/workspaces/.gradle-user-home
    command: sleep infinity
    environment:
      JAVA_HOME: /usr/lib/jvm/msopenjdk-current
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mobilispect
      DB_USER: mobilispect
      DB_PASSWORD: mobilispect
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobilispect
      POSTGRES_USER: mobilispect
      POSTGRES_PASSWORD: mobilispect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilispect"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.1.7
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      MOBILISPECT_GTFS_STORAGE_ROOT: /var/lib/mobilispect/gtfs
      AIRFLOW_DB_HOST: airflow-postgres
      AIRFLOW_DB_PORT: "5432"
      AIRFLOW_DB_NAME: airflow
      AIRFLOW_DB_USER: airflow
      AIRFLOW_DB_PASSWORD: airflow
      MOBILISPECT_DB_HOST: airflow-postgres
      MOBILISPECT_DB_PORT: "5432"
      MOBILISPECT_DB_NAME: mobilispect
      MOBILISPECT_DB_USER: airflow
      MOBILISPECT_DB_PASSWORD: airflow
    volumes:
      - ..:/workspaces:cached
      - ../airflow/dags:/opt/airflow/dags:cached
      - ../airflow/pipeline:/opt/airflow/pipeline:cached
      - gtfs-data:/var/lib/mobilispect/gtfs
    ports:
      - "8081:8080"
    command:
      [
        "bash",
        "-lc",
        "export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=\"postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}\" && export MOBILISPECT_DATABASE_URL=\"postgresql+psycopg2://${MOBILISPECT_DB_USER}:${MOBILISPECT_DB_PASSWORD}@${MOBILISPECT_DB_HOST}:${MOBILISPECT_DB_PORT}/${MOBILISPECT_DB_NAME}\" && pip install --no-cache-dir -r /workspaces/backend/airflow/requirements.txt && airflow db migrate && airflow users create --role Admin --username admin --password admin --email admin@example.com --firstname Admin --lastname User || true && airflow webserver & airflow scheduler"
      ]

volumes:
  gradle-cache:
  postgres-data:
  airflow-postgres-data:
  gtfs-data:
