[package]
name = "mobilispect-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mobilispect-worker"
path = "src/main.rs"

[dependencies]
mobilispect-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["gzip", "json"] }
serde = { version = "1", features = ["derive"] }
gtfs-structures = "0.47"
prost = "0.13"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
axum = "0.7"
serde_json = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
shapefile = "0.9.0"
zip = "8.6.0"
proj4rs = "0.1.10"
unicode-normalization = "0.1.25"
tempfile = "3.27.0"
dbase = "0.8.0"

[dev-dependencies]
mobilispect-core = { path = "../core", features = ["test-utils"] }
tokio = { version = "1", features = ["full"] }
wiremock = "0.6.5"

[build-dependencies]
prost-build = "0.13"
