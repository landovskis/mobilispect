[package]
name = "corridor-builder-web"
version = "0.1.0"
edition = "2024"

# Empty [workspace] table stops Cargo's upward workspace-root search at this
# manifest. Without it, Cargo's search for an excluded crate's workspace root
# does not stop at the excluding manifest; it keeps walking up. In this repo,
# worktrees live nested inside the main checkout's directory tree, so the
# walk lands on the main checkout's own Cargo.toml and errors. See:
# https://doc.rust-lang.org/cargo/reference/workspaces.html
[workspace]

[[bin]]
name = "corridor-builder-web"
path = "src/main.rs"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "EventTarget",
] }
gloo-net = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
