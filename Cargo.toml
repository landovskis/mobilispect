[package]
name = "mobilispect"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mobilispect-server"
path = "src/bin/server.rs"

[[bin]]
name = "mobilispect-worker"
path = "src/bin/worker.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["gzip", "json"] }

# GTFS static feed parsing
gtfs-structures = "0.26"

# GTFS-RT protobuf decoding
prost = "0.13"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }

# Web server
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# HTML templates
askama = { version = "0.15", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config / env
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Byte buffers
bytes = "1"

# Error handling
anyhow = "1"
thiserror = "2"

[package.metadata.bin]
cargo-watch = { version = "8" }

[dev-dependencies]
testcontainers = "0.21"
testcontainers-modules = { version = "0.9", features = ["postgres"] }
tokio = { version = "1", features = ["full"] }

[build-dependencies]
# For compiling GTFS-RT .proto files
prost-build = "0.13"
