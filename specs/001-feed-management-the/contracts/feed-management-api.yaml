openapi: 3.0.3
info:
  title: Feed Management API
  description: Administrative API for managing transit feed imports from Transit.land
  version: 1.0.0
  contact:
    name: Mobilispect Team
    email: dev@mobilispect.com

servers:
  - url: https://api.mobilispect.com/api/feed-management
    description: Production server
  - url: https://staging.api.mobilispect.com/api/feed-management
    description: Staging server

security:
  - bearerAuth: []

paths:
  /regions:
    get:
      summary: List available metropolitan regions
      description: Get list of metropolitan regions with available transit feeds
      operationId: listRegions
      tags:
        - Regions
      security:
        - bearerAuth: []
      parameters:
        - name: autoUpdateEnabled
          in: query
          description: Filter by auto-update status
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of metropolitan regions
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetropolitanRegion'
                  total:
                    type: integer
                    description: Total number of regions
        '403':
          $ref: '#/components/responses/Forbidden'

  /regions/{regionOnestopId}:
    get:
      summary: Get region details
      description: Get detailed information about a specific metropolitan region
      operationId: getRegion
      tags:
        - Regions
      parameters:
        - $ref: '#/components/parameters/RegionOnestopId'
      responses:
        '200':
          description: Region details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetropolitanRegionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      summary: Update region configuration
      description: Update region settings (managers only)
      operationId: updateRegion
      tags:
        - Regions
      parameters:
        - $ref: '#/components/parameters/RegionOnestopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autoUpdateEnabled:
                  type: boolean
                  description: Enable/disable daily automatic updates
      responses:
        '200':
          description: Region updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetropolitanRegion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /regions/{regionOnestopId}/feeds:
    get:
      summary: List feeds for a region
      description: Get all feeds available for a metropolitan region
      operationId: listFeedsForRegion
      tags:
        - Feeds
      parameters:
        - $ref: '#/components/parameters/RegionOnestopId'
        - name: specType
          in: query
          description: Filter by feed specification type
          required: false
          schema:
            type: string
            enum: [gtfs, gtfs-rt]
        - name: status
          in: query
          description: Filter by feed status
          required: false
          schema:
            $ref: '#/components/schemas/FeedStatus'
      responses:
        '200':
          description: List of feeds for the region
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Feed'
                  total:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /feeds/{feedOnestopId}:
    get:
      summary: Get feed details
      description: Get detailed information about a specific feed
      operationId: getFeed
      tags:
        - Feeds
      parameters:
        - $ref: '#/components/parameters/FeedOnestopId'
      responses:
        '200':
          description: Feed details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /feeds/{feedOnestopId}/import:
    post:
      summary: Start feed import
      description: Manually trigger import of a feed (operators and managers only)
      operationId: startFeedImport
      tags:
        - Imports
      parameters:
        - $ref: '#/components/parameters/FeedOnestopId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Force import even if content hasn't changed
                  default: false
      responses:
        '202':
          description: Import started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedImport'
        '409':
          description: Import already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /feeds/{feedOnestopId}/imports:
    get:
      summary: Get import history for feed
      description: Get paginated list of import attempts for a feed
      operationId: getFeedImportHistory
      tags:
        - Imports
      parameters:
        - $ref: '#/components/parameters/FeedOnestopId'
        - name: page
          in: query
          description: Page number (0-based)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by import status
          required: false
          schema:
            $ref: '#/components/schemas/ImportStatus'
      responses:
        '200':
          description: Import history for the feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedImport'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /imports/{importId}:
    get:
      summary: Get import details
      description: Get detailed information about a specific import
      operationId: getImport
      tags:
        - Imports
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedImportDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      summary: Cancel import
      description: Cancel a running import (operators and managers only)
      operationId: cancelImport
      tags:
        - Imports
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedImport'
        '409':
          description: Import cannot be cancelled (already completed/failed)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /imports/{importId}/progress:
    get:
      summary: Get import progress
      description: Get real-time progress information for an active import
      operationId: getImportProgress
      tags:
        - Imports
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import progress information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportProgress'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /imports/{importId}/logs:
    get:
      summary: Get import logs
      description: Get detailed logs for an import operation
      operationId: getImportLogs
      tags:
        - Imports
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - name: level
          in: query
          description: Filter by log level
          required: false
          schema:
            $ref: '#/components/schemas/LogLevel'
        - name: component
          in: query
          description: Filter by component
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Import logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportLog'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /imports/active:
    get:
      summary: Get active imports
      description: Get list of currently running imports across all feeds
      operationId: getActiveImports
      tags:
        - Imports
      responses:
        '200':
          description: List of active imports
          content:
            application/json:
              schema:
                type: object
                properties:
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedImportSummary'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /feeds/{feedOnestopId}/authentication:
    get:
      summary: Get feed authentication info
      description: Get authentication configuration for a feed (managers only)
      operationId: getFeedAuthentication
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/FeedOnestopId'
      responses:
        '200':
          description: Feed authentication configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedAuthentication'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      summary: Update feed authentication
      description: Update authentication configuration for a feed (managers only)
      operationId: updateFeedAuthentication
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/FeedOnestopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedAuthenticationUpdate'
      responses:
        '200':
          description: Authentication updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedAuthentication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RegionOnestopId:
      name: regionOnestopId
      in: path
      description: Transit.land region Onestop ID
      required: true
      schema:
        type: string
        pattern: '^r-[0-9a-z]+-[a-z0-9\-]+$'
        example: 'r-9q8y-montreal'

    FeedOnestopId:
      name: feedOnestopId
      in: path
      description: Transit.land feed Onestop ID
      required: true
      schema:
        type: string
        pattern: '^f-[0-9a-z]+(~[a-z]+)?-[a-z0-9\-]+$'
        example: 'f-f25d-socitdetransportdemontreal'

    ImportId:
      name: importId
      in: path
      description: Import UUID
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    MetropolitanRegion:
      type: object
      properties:
        regionOnestopId:
          type: string
          description: Transit.land region Onestop ID
          example: 'r-9q8y-montreal'
        name:
          type: string
          description: Human-readable region name
          example: 'Montreal'
        autoUpdateEnabled:
          type: boolean
          description: Whether daily automatic updates are enabled
        feedCount:
          type: integer
          description: Number of active feeds in this region
        lastCheckAt:
          type: string
          format: date-time
          description: Last time feeds were checked for updates
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MetropolitanRegionDetail:
      allOf:
        - $ref: '#/components/schemas/MetropolitanRegion'
        - type: object
          properties:
            feeds:
              type: array
              items:
                $ref: '#/components/schemas/Feed'

    Feed:
      type: object
      properties:
        feedOnestopId:
          type: string
          description: Transit.land feed Onestop ID
          example: 'f-f25d-socitdetransportdemontreal'
        regionOnestopId:
          type: string
          description: Parent region Onestop ID
          example: 'r-9q8y-montreal'
        name:
          type: string
          description: Feed display name
          example: 'STM GTFS'
        specType:
          $ref: '#/components/schemas/FeedSpecType'
        downloadUrl:
          type: string
          format: uri
          description: Current download URL for the feed
        currentVersionSha1:
          type: string
          description: SHA1 of current feed version
          nullable: true
          example: '5817a9f002832e405651ccdd7e929d3c10590d25'
        lastCheckedAt:
          type: string
          format: date-time
          description: Last time feed was checked for updates
          nullable: true
        lastUpdatedAt:
          type: string
          format: date-time
          description: Last time feed content was updated
          nullable: true
        status:
          $ref: '#/components/schemas/FeedStatus'
        hasAuthentication:
          type: boolean
          description: Whether this feed requires authentication
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeedDetail:
      allOf:
        - $ref: '#/components/schemas/Feed'
        - type: object
          properties:
            recentImports:
              type: array
              description: Recent import attempts (last 5)
              items:
                $ref: '#/components/schemas/FeedImportSummary'

    FeedImport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique import identifier
        feedOnestopId:
          type: string
          description: Feed being imported
        administratorId:
          type: string
          format: uuid
          description: Administrator who initiated import
          nullable: true
        administratorUsername:
          type: string
          description: Username of administrator who initiated import
          nullable: true
        triggerType:
          $ref: '#/components/schemas/TriggerType'
        status:
          $ref: '#/components/schemas/ImportStatus'
        versionSha1:
          type: string
          description: SHA1 of imported feed version
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        fileSizeBytes:
          type: integer
          format: int64
          description: Size of downloaded feed file
          nullable: true
        errorMessage:
          type: string
          description: Error description if import failed
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeedImportDetail:
      allOf:
        - $ref: '#/components/schemas/FeedImport'
        - type: object
          properties:
            feedName:
              type: string
              description: Name of the imported feed
            regionName:
              type: string
              description: Name of the region
            progress:
              $ref: '#/components/schemas/ImportProgress'
            recentLogs:
              type: array
              description: Recent log entries (last 10)
              items:
                $ref: '#/components/schemas/ImportLog'

    FeedImportSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feedOnestopId:
          type: string
        feedName:
          type: string
        regionName:
          type: string
        status:
          $ref: '#/components/schemas/ImportStatus'
        triggerType:
          $ref: '#/components/schemas/TriggerType'
        startedAt:
          type: string
          format: date-time
          nullable: true
        progress:
          $ref: '#/components/schemas/ImportProgress'

    ImportProgress:
      type: object
      properties:
        progressPercentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Completion percentage
        totalSteps:
          type: integer
          description: Total number of processing steps
        currentStep:
          type: string
          description: Description of current step
        estimatedTimeRemainingSeconds:
          type: integer
          description: Estimated time to completion in seconds
          nullable: true

    ImportLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        importId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
          description: Human-readable log message
        component:
          type: string
          description: Processing component
          nullable: true
        details:
          type: object
          description: Extended details in JSON format
          nullable: true
        createdAt:
          type: string
          format: date-time

    FeedAuthentication:
      type: object
      properties:
        feedOnestopId:
          type: string
        authType:
          $ref: '#/components/schemas/AuthType'
        hasCredentials:
          type: boolean
          description: Whether credentials are configured
        expiresAt:
          type: string
          format: date-time
          description: Credential expiration time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeedAuthenticationUpdate:
      type: object
      properties:
        authType:
          $ref: '#/components/schemas/AuthType'
        credentials:
          type: object
          description: Authentication credentials (encrypted before storage)
          properties:
            apiKey:
              type: string
              description: API key for api_key auth type
            clientId:
              type: string
              description: OAuth client ID for oauth2 auth type
            clientSecret:
              type: string
              description: OAuth client secret for oauth2 auth type
            tokenUrl:
              type: string
              format: uri
              description: OAuth token endpoint for oauth2 auth type

    PageInfo:
      type: object
      properties:
        page:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer
          description: Page size
        totalElements:
          type: integer
          description: Total number of elements
        totalPages:
          type: integer
          description: Total number of pages
        hasNext:
          type: boolean
          description: Whether there are more pages
        hasPrevious:
          type: boolean
          description: Whether there are previous pages

    # Enums
    FeedSpecType:
      type: string
      enum:
        - gtfs
        - gtfs-rt
      description: Feed specification type

    FeedStatus:
      type: string
      enum:
        - active
        - inactive
        - error
      description: Feed status

    ImportStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
      description: Import status

    TriggerType:
      type: string
      enum:
        - manual
        - automatic
      description: How the import was triggered

    AuthType:
      type: string
      enum:
        - none
        - api_key
        - oauth2
      description: Authentication method

    LogLevel:
      type: string
      enum:
        - info
        - warn
        - error
      description: Log severity level

    # Error responses
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
          nullable: true
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'