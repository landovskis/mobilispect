openapi: 3.0.3
info:
  title: Transit Frequency Analysis - Frequency API
  description: API for querying route frequency data, variants, and common sections
  version: 1.0.0
  contact:
    name: Mobilispect Development Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.mobilispect.com/v1
    description: Production

tags:
  - name: Routes
    description: Route and route variant operations
  - name: Frequencies
    description: Service frequency query operations
  - name: CommonSections
    description: Common section analysis operations

paths:
  /agencies/{agencyId}/routes:
    get:
      summary: List routes for agency
      description: Retrieve all routes operated by a specific agency
      operationId: getRoutesByAgency
      tags:
        - Routes
      parameters:
        - name: agencyId
          in: path
          description: Unique agency identifier
          required: true
          schema:
            type: string
        - name: active
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
            default: true
        - name: routeType
          in: query
          description: Filter by route type (BUS, RAIL, etc.)
          required: false
          schema:
            type: string
            enum: [TRAM, SUBWAY, RAIL, BUS, FERRY, CABLE_TRAM, AERIAL_LIFT, FUNICULAR, TROLLEYBUS, MONORAIL]
      responses:
        '200':
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteResponse'
        '404':
          description: Agency not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /routes/{routeId}:
    get:
      summary: Get route details
      description: Retrieve detailed information about a specific route including all variants
      operationId: getRouteById
      tags:
        - Routes
      parameters:
        - name: routeId
          in: path
          description: Unique route identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Route details with variants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetailResponse'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /routes/{routeId}/variants:
    get:
      summary: List route variants
      description: Retrieve all service pattern variants for a specific route
      operationId: getRouteVariants
      tags:
        - Routes
      parameters:
        - name: routeId
          in: path
          description: Unique route identifier
          required: true
          schema:
            type: string
        - name: active
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of route variants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteVariantResponse'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /variants/{variantHash}/frequency:
    get:
      summary: Get frequency data for variant
      description: Retrieve service frequency information for a specific route variant
      operationId: getVariantFrequency
      tags:
        - Frequencies
      parameters:
        - name: variantHash
          in: path
          description: Route variant identifier (hash)
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
        - name: date
          in: query
          description: Service date (defaults to today)
          required: false
          schema:
            type: string
            format: date
        - name: timePeriod
          in: query
          description: Specific time period (optional, returns all if omitted)
          required: false
          schema:
            type: string
            enum: [WEEKDAY_AM_PEAK, WEEKDAY_PM_PEAK, WEEKDAY_OFF_PEAK, WEEKEND, HOLIDAY]
      responses:
        '200':
          description: Frequency data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequencyResponse'
        '404':
          description: Variant not found or no frequency data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /routes/{routeId}/frequency/summary:
    get:
      summary: Get frequency summary for route
      description: Retrieve aggregated frequency information across all variants of a route
      operationId: getRouteFrequencySummary
      tags:
        - Frequencies
      parameters:
        - name: routeId
          in: path
          description: Unique route identifier
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Service date (defaults to today)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Route frequency summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteFrequencySummaryResponse'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /routes/{routeId}/common-sections:
    get:
      summary: Get common sections for route
      description: Retrieve route segments that overlap with other routes
      operationId: getCommonSections
      tags:
        - CommonSections
      parameters:
        - name: routeId
          in: path
          description: Unique route identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of common sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonSectionResponse'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /common-sections/{sectionId}/frequency:
    get:
      summary: Get combined frequency for common section
      description: Retrieve aggregate frequency for a common section across all contributing routes
      operationId: getCommonSectionFrequency
      tags:
        - CommonSections
      parameters:
        - name: sectionId
          in: path
          description: Common section identifier
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Service date (defaults to today)
          required: false
          schema:
            type: string
            format: date
        - name: timePeriod
          in: query
          description: Specific time period (optional)
          required: false
          schema:
            type: string
            enum: [WEEKDAY_AM_PEAK, WEEKDAY_PM_PEAK, WEEKDAY_OFF_PEAK, WEEKEND, HOLIDAY]
      responses:
        '200':
          description: Combined frequency data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonSectionFrequencyResponse'
        '404':
          description: Common section not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RouteResponse:
      type: object
      required:
        - id
        - shortName
        - longName
        - routeType
        - agencyId
        - active
      properties:
        id:
          type: string
          description: Unique route identifier
        shortName:
          type: string
          description: Short route name (e.g., "5", "Red Line")
          example: "38"
        longName:
          type: string
          description: Full route name
          example: "Geary Boulevard"
        routeType:
          type: string
          enum: [TRAM, SUBWAY, RAIL, BUS, FERRY, CABLE_TRAM, AERIAL_LIFT, FUNICULAR, TROLLEYBUS, MONORAIL]
        color:
          type: string
          description: Route color as hex string
          example: "FF0000"
        textColor:
          type: string
          description: Text color as hex string
          example: "FFFFFF"
        agencyId:
          type: string
          description: Parent agency identifier
        variantCount:
          type: integer
          description: Number of service pattern variants
        active:
          type: boolean
          description: Whether the route is currently active

    RouteDetailResponse:
      allOf:
        - $ref: '#/components/schemas/RouteResponse'
        - type: object
          properties:
            variants:
              type: array
              items:
                $ref: '#/components/schemas/RouteVariantResponse'
            frequencySummary:
              $ref: '#/components/schemas/FrequencySummary'

    RouteVariantResponse:
      type: object
      required:
        - id
        - routeId
        - stopCount
        - active
      properties:
        id:
          type: string
          description: Variant hash (SHA-256 of stop pattern)
          pattern: '^[a-f0-9]{64}$'
        routeId:
          type: string
          description: Parent route identifier
        directionId:
          type: integer
          description: Direction indicator (0=outbound, 1=inbound)
          enum: [0, 1]
        headsign:
          type: string
          description: Destination headsign
          example: "Downtown via Market St"
        stopCount:
          type: integer
          description: Number of stops in this variant
          minimum: 2
        firstStopId:
          type: string
          description: First stop identifier
        lastStopId:
          type: string
          description: Last stop identifier
        stopPattern:
          type: array
          description: Ordered list of stop IDs
          items:
            type: string
        active:
          type: boolean
          description: Whether this variant is currently active
        firstSeen:
          type: string
          format: date-time
          description: When this variant was first observed
        lastSeen:
          type: string
          format: date-time
          description: When this variant was last observed

    FrequencyResponse:
      type: object
      required:
        - variantId
        - serviceDate
        - frequencies
      properties:
        variantId:
          type: string
          description: Route variant identifier
        serviceDate:
          type: string
          format: date
          description: Service date for this frequency data
        frequencies:
          type: array
          items:
            $ref: '#/components/schemas/TimePeriodFrequency'

    TimePeriodFrequency:
      type: object
      required:
        - timePeriod
        - tripCount
      properties:
        timePeriod:
          type: string
          enum: [WEEKDAY_AM_PEAK, WEEKDAY_PM_PEAK, WEEKDAY_OFF_PEAK, WEEKEND, HOLIDAY]
        averageHeadway:
          type: number
          format: double
          description: Average time between departures in minutes
          example: 15.5
        minHeadway:
          type: number
          format: double
          description: Minimum headway observed in minutes
          example: 10.0
        maxHeadway:
          type: number
          format: double
          description: Maximum headway observed in minutes
          example: 20.0
        tripCount:
          type: integer
          description: Number of trips in this period
          minimum: 0
        isIrregular:
          type: boolean
          description: True if no fixed frequency pattern
        calculatedAt:
          type: string
          format: date-time
          description: When this frequency was calculated

    FrequencySummary:
      type: object
      description: Aggregated frequency statistics across variants/periods
      properties:
        averageFrequency:
          type: number
          format: double
          description: Overall average headway in minutes
        peakFrequency:
          type: number
          format: double
          description: Best (shortest) average headway across all periods
        offPeakFrequency:
          type: number
          format: double
          description: Off-peak average headway

    RouteFrequencySummaryResponse:
      type: object
      required:
        - routeId
        - serviceDate
        - variantFrequencies
      properties:
        routeId:
          type: string
        serviceDate:
          type: string
          format: date
        variantFrequencies:
          type: array
          items:
            type: object
            properties:
              variantId:
                type: string
              headsign:
                type: string
              frequencies:
                type: array
                items:
                  $ref: '#/components/schemas/TimePeriodFrequency'
        aggregateSummary:
          $ref: '#/components/schemas/FrequencySummary'

    CommonSectionResponse:
      type: object
      required:
        - id
        - stopCount
        - firstStopId
        - lastStopId
        - contributingRoutes
      properties:
        id:
          type: string
          format: uuid
          description: Common section identifier
        stopPattern:
          type: array
          description: Ordered list of stop IDs in common section
          items:
            type: string
        stopCount:
          type: integer
          description: Number of stops in common section
          minimum: 3
        firstStopId:
          type: string
          description: First stop of common section
        lastStopId:
          type: string
          description: Last stop of common section
        contributingRoutes:
          type: array
          description: Routes that share this common section
          items:
            type: object
            properties:
              routeId:
                type: string
              routeName:
                type: string
              variantCount:
                type: integer
                description: Number of variants using this section

    CommonSectionFrequencyResponse:
      type: object
      required:
        - commonSectionId
        - serviceDate
        - combinedFrequencies
      properties:
        commonSectionId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        combinedFrequencies:
          type: array
          description: Combined frequency by time period
          items:
            type: object
            properties:
              timePeriod:
                type: string
                enum: [WEEKDAY_AM_PEAK, WEEKDAY_PM_PEAK, WEEKDAY_OFF_PEAK, WEEKEND, HOLIDAY]
              combinedHeadway:
                type: number
                format: double
                description: Combined average headway (sum of all contributing routes)
              contributingVariants:
                type: array
                description: Individual variant contributions
                items:
                  type: object
                  properties:
                    variantId:
                      type: string
                    routeName:
                      type: string
                    headway:
                      type: number
                      format: double

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
