<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 520 150"
  role="img"
>
  <title>Mobilispect Logo – Dark Mode</title>

  <defs>
    <linearGradient id="ms-grad-main-dark" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#1B8CFF" />
      <stop offset="100%" stop-color="#34D8FF" />
    </linearGradient>
  </defs>

  <g transform="translate(25,20)">
    <g transform="translate(50,60) rotate(45)">
      <rect x="-40" y="-40" width="80" height="80" rx="16" fill="url(#ms-grad-main-dark)" />
    </g>
  </g>

  <g transform="translate(160,70)">
    <text
      x="0"
      y="0"
      font-size="40"
      font-weight="700"
      dominant-baseline="middle"
    >
      <tspan fill="#E3F4FF">Mobili</tspan>
      <tspan fill="#34D8FF">spect</tspan>
    </text>

    <text
      x="2"
      y="32"
      font-size="13"
      letter-spacing="3"
      fill="#9FC7FF"
    >
      TRANSIT · ACTIVE MOBILITY
    </text>
  </g>
</svg>
