<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  role="img"
>
  <title>Mobilispect Icon</title>

  <defs>
    <linearGradient id="ms-grad-main" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#0B4F8A"/>
      <stop offset="100%" stop-color="#00A7C4"/>
    </linearGradient>

    <linearGradient id="ms-grad-route" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5FBFF"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
  </defs>

  <g transform="translate(10,10)">
    <g transform="translate(50,50) rotate(45)">
      <rect x="-40" y="-40" width="80" height="80" rx="16" fill="url(#ms-grad-main)" />
    </g>

    <circle cx="50" cy="50" r="30" fill="none" stroke="#E1F3FF" stroke-width="3" stroke-dasharray="4 4"/>

    <path d="M50 25 L56 50 L50 75 L44 50 Z" fill="#FFFFFF"/>

    <path
      d="M30 68 Q35 38 50 42 Q65 46 70 30 L80 46"
      fill="none"
      stroke="url(#ms-grad-route)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle cx="30" cy="68" r="3.5" fill="#FFD54F"/>
    <circle cx="50" cy="42" r="3.5" fill="#FFFFFF"/>
    <circle cx="70" cy="30" r="3.5" fill="#FFD54F"/>

    <path d="M80 46 L86 43 L84 49 Z" fill="#FFD54F"/>
  </g>
</svg>
