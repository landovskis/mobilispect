<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 520 150"
  role="img"
>
  <title>Mobilispect Logo</title>

  <defs>
    <linearGradient id="ms-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4F8A" />
      <stop offset="100%" stop-color="#00A7C4" />
    </linearGradient>

    <linearGradient id="ms-grad-route" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F5FBFF" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
  </defs>

  <g transform="translate(25,20)">
    <g transform="translate(50,60) rotate(45)">
      <rect x="-40" y="-40" width="80" height="80" rx="16" ry="16" fill="url(#ms-grad-main)" />
    </g>

    <circle cx="50" cy="60" r="30" fill="none" stroke="#E1F3FF" stroke-width="3" stroke-dasharray="4 4"/>

    <path d="M50 35 L56 60 L50 85 L44 60 Z" fill="#FFFFFF"/>

    <path
      d="M30 78 Q35 48 50 52 Q65 56 70 40 L80 56"
      fill="none"
      stroke="url(#ms-grad-route)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle cx="30" cy="78" r="3.5" fill="#FFD54F"/>
    <circle cx="50" cy="52" r="3.5" fill="#FFFFFF"/>
    <circle cx="70" cy="40" r="3.5" fill="#FFD54F"/>

    <path d="M80 56 L86 53 L84 59 Z" fill="#FFD54F"/>

    <line x1="50" y1="22" x2="50" y2="15" stroke="#E1F3FF" stroke-width="2"/>
    <line x1="90" y1="60" x2="96" y2="60" stroke="#E1F3FF" stroke-width="2"/>
    <line x1="50" y1="98" x2="50" y2="105" stroke="#E1F3FF" stroke-width="2"/>
    <line x1="10" y1="60" x2="4"  y2="60" stroke="#E1F3FF" stroke-width="2"/>
  </g>

  <g transform="translate(160,70)">
    <text
      x="0"
      y="0"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI'"
      font-size="40"
      font-weight="700"
      dominant-baseline="middle"
    >
      <tspan fill="#0B3558">Mobili</tspan>
      <tspan fill="#00A7C4">spect</tspan>
    </text>

    <text
      x="2"
      y="32"
      font-family="system-ui"
      font-size="13"
      letter-spacing="3"
      fill="#4D7CA8"
    >
      TRANSIT · ACTIVE MOBILITY
    </text>

    <rect x="2" y="40" width="220" height="3" rx="1.5" fill="#00A7C4"/>
  </g>
</svg>
