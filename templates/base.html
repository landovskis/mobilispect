<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mobilispect — Transit Performance{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
          /* ── LUMINA tokens ─────────────────────── */
          --ink-900: #1A1814;     /* was #17202c */
          --ink-800: #3D3935;
          --ink-700: #645F5A;
          --ink-500: #888480;
          --ink-400: #A8A49B;
          --paper: #FAFAF7;
          --surface: #FFFFFF;
          --surface-muted: #F4F4EF;
          --line: #E0DDD6;
          --line-soft: #ECEAE4;
          --civic-green: #3D9A6B;
          --civic-green-bg: #D0F0E0;
          --civic-amber: #E8A020;
          --civic-amber-bg: #FDF0D0;
          --civic-red: #C8463A;
          --civic-red-bg: #F9DDD9;
          --link-blue: #1D4E89;
          --link-blue-hover: #163A67;
          --link-blue-bg: #D0E0F3;
          --express-bg: #F0E8FF;
          --express-fg: #6B21D9;
          --shadow-sm: 0 1px 2px rgb(26 24 20 / 0.06);
          --shadow: 0 8px 24px rgb(26 24 20 / 0.10);
          --radius: 8px;
          /* ── transition helper ─────────────────── */
          --transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        html.dark {
          --ink-900: #EDE8E0;
          --ink-800: #CCC7C0;
          --ink-700: #B5AFA6;
          --ink-500: #9E9890;
          --ink-400: #8C8680;
          --paper: #0D0B09;
          --surface: #1E1A16;
          --surface-muted: #161310;
          --line: #352C22;
          --line-soft: #272018;
          --civic-green: #4DAA7B;
          --civic-green-bg: rgba(77,170,123,0.15);
          --civic-amber: #E8A82A;
          --civic-amber-bg: rgba(232,168,42,0.15);
          --civic-red: #D95045;
          --civic-red-bg: rgba(217,80,69,0.15);
          --link-blue: #5A94CC;
          --link-blue-hover: #4A80B8;
          --link-blue-bg: rgba(90,148,204,0.15);
          --express-bg: rgba(107,33,217,0.18);
          --express-fg: #B08AFF;
          --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
          --shadow: 0 8px 24px rgb(0 0 0 / 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        *, *::before, *::after {
            transition: background-color 0.15s ease, border-color 0.15s ease,
                        color 0.05s ease, box-shadow 0.15s ease;
        }

        body {
            font-family: 'Jost', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--paper);
            color: var(--ink-900);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--link-blue);
            color: white;
            padding: 0.85rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--line);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-900);
        }

        .logo-text {
            display: flex;
            align-items: baseline;
            gap: 0;
            line-height: 1.2;
        }

        .logo-mobili {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 300;
            font-size: 1.25rem;
            color: white;
            letter-spacing: -0.01em;
        }

        .logo-spect {
            font-family: 'Fira Code', monospace;
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--civic-red);
            letter-spacing: -0.02em;
            margin-bottom: 1px;
        }

        .logo-region {
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.5);
            font-weight: 400;
            letter-spacing: 0.04em;
            margin-left: 0.5rem;
            margin-bottom: 1px;
        }

        nav {
            display: flex;
            gap: 1.25rem;
        }

        nav a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0;
            padding: 1.5rem 0.5rem;
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 3rem 1rem;
            margin-top: 4rem;
            text-align: center;
            color: var(--ink-500);
            font-size: 0.875rem;
        }

        /* Common Components */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background-color: var(--link-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--link-blue-hover);
            transform: translateY(-1px);
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.green, .badge.status-good {
            background-color: var(--civic-green-bg);
            color: var(--civic-green);
        }

        .badge.yellow, .badge.status-watch {
            background-color: var(--civic-amber-bg);
            color: var(--civic-amber);
        }

        .badge.red, .badge.status-bad {
            background-color: var(--civic-red-bg);
            color: var(--civic-red);
        }

        .badge.none, .badge.status-none {
            background-color: var(--surface-muted);
            color: var(--ink-500);
        }

        .badge--local  { background: var(--link-blue-bg); color: var(--link-blue); }
        .badge--rapid     { background: var(--civic-green-bg); color: var(--civic-green); }
        .badge--express   { background: var(--express-bg); color: var(--express-fg); }

        .mono {
            font-family: 'Fira Code', monospace;
            font-weight: 500;
        }

        .status-good, .green, .gap-pos, .faster, .improve {
            color: var(--civic-green);
        }

        .status-watch, .yellow, .onpace, .warn {
            color: var(--civic-amber);
        }

        .status-bad, .red, .gap-neg, .slower, .decline, .poor {
            color: var(--civic-red);
        }

        /* Shared Component Classes */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .page-title {
            font-size: 1.6rem;
            line-height: 1.2;
            color: var(--ink-900);
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 300;
            letter-spacing: -0.01em;
        }
        .page-subtitle {
            margin-top: 0.35rem;
            color: var(--ink-500);
            font-size: 0.9rem;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .metric-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            box-shadow: var(--shadow-sm);
        }
        .metric-label {
            color: var(--ink-500);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .metric-value {
            margin-top: 0.2rem;
            color: var(--ink-900);
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 300;
            letter-spacing: -0.02em;
        }
        .filter-bar,
        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .filter-bar {
            margin-bottom: 1.5rem;
        }
        .filter-label,
        .control-label {
            color: var(--ink-500);
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .filter-pill,
        .filter-bar a,
        .control-row a {
            display: inline-flex;
            align-items: center;
            min-height: 2rem;
            padding: 0.35rem 0.75rem;
            margin: 0.25rem 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink-700);
            font-size: 0.84rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
        .filter-pill:hover,
        .filter-bar a:hover,
        .control-row a:hover {
            border-color: var(--link-blue);
            color: var(--link-blue);
        }
        .filter-pill.active,
        .filter-bar a.active,
        .control-row a.active {
            background: var(--link-blue);
            border-color: var(--link-blue);
            color: white;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .data-table th {
            padding: 0.5rem 0.75rem;
            text-align: left;
            color: var(--ink-500);
            background: var(--surface-muted);
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .data-table td {
            padding: 0.5rem 0.75rem;
            border-top: 1px solid var(--line-soft);
            font-size: 0.9rem;
        }
        .data-table tr:hover td {
            background: var(--surface-muted);
        }
        .route-id {
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            color: var(--ink-900);
        }
        .empty-state {
            padding: 3rem 1rem;
            color: var(--ink-500);
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        @media (max-width: 720px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.8rem;
            }
            nav {
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            .container {
                padding: 1rem 0.5rem;
            }
            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        /* Specific blocks */
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <a href="/" class="logo">
            <div class="logo-icon">
                <svg width="34" height="34" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="0.75" y="0.75" width="54.5" height="54.5" rx="13" fill="#1A1814" stroke="#2A2420" stroke-width="0.5"/>
                    <line x1="5" y1="28" x2="15" y2="28" stroke="#3D3733" stroke-width="2" stroke-linecap="round"/>
                    <line x1="33" y1="28" x2="51" y2="28" stroke="#3D3733" stroke-width="2" stroke-linecap="round"/>
                    <path d="M15,28 C17,28 18,38 22,38 C26,38 24,14 28,14 C32,14 32,28 33,28" stroke="#C8463A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <circle cx="28" cy="28" r="15" stroke="#C8463A" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3.8 2.8"/>
                    <circle cx="28" cy="14" r="3.5" fill="#C8463A"/>
                    <circle cx="28" cy="14" r="1.5" fill="#F28070"/>
                </svg>
            </div>
            <span class="logo-text"><span class="logo-mobili">mobili</span><span class="logo-spect">spect</span><span class="logo-region">{% block region_name %}{% endblock %}</span></span>
        </a>
        <nav>
            <a href="/" class="{% block nav_speed %}{% endblock %}">Speeds</a>
            <button id="theme-toggle" type="button" aria-label="Toggle colour scheme" onclick="toggleTheme()"
              style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:'Fira Code',monospace;font-size:0.68rem;letter-spacing:0.05em;display:flex;align-items:center;gap:6px;">
              <span id="theme-icon">☀️</span><span id="theme-label">LIGHT</span>
            </button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Mobilispect. Real-time performance monitoring for public transit.</p>
        <p style="margin-top: 0.5rem; font-size: 0.75rem; opacity: 0.7;">Data Source: STM & various GTFS-RT feeds</p>
    </footer>

    {% block extra_scripts %}{% endblock %}
    <script>
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('theme-label').textContent = isDark ? 'DARK' : 'LIGHT';
  document.getElementById('theme-icon').textContent  = isDark ? '🌙' : '☀️';
  localStorage.setItem('lumina-theme', isDark ? 'dark' : 'light');
}
(function initTheme() {
  const saved = localStorage.getItem('lumina-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) {
    document.documentElement.classList.add('dark');
    const lbl = document.getElementById('theme-label');
    const ico = document.getElementById('theme-icon');
    if (lbl) lbl.textContent = 'DARK';
    if (ico) ico.textContent = '🌙';
  }
})();
    </script>
</body>
</html>
