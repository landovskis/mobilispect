<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mobilispect — Transit Performance{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Civic Ledger Palette */
            --ink-900: #17202c;
            --ink-800: #1f2937;
            --ink-700: #334155;
            --ink-500: #627083;
            --ink-400: #7b8796;
            --paper: #f7f9fb;
            --surface: #ffffff;
            --surface-muted: #f1f5f9;
            --line: #d8dee8;
            --line-soft: #edf0f5;
            --civic-green: #2d8f67;
            --civic-green-bg: #e8f7ef;
            --civic-amber: #f0b84b;
            --civic-amber-bg: #fff4d8;
            --civic-red: #c9483f;
            --civic-red-bg: #fbe4e1;
            --link-blue: #2f6f9f;
            --link-blue-bg: #e7f1f7;
            --shadow-sm: 0 1px 2px rgb(23 32 44 / 0.05);
            --shadow: 0 8px 24px rgb(23 32 44 / 0.08);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--paper);
            color: var(--ink-900);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--ink-900);
            color: white;
            padding: 0.85rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--line);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: transparent;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-900);
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            letter-spacing: -0.02em;
            gap: 0.25rem;
            line-height: 1.2;
        }

        .logo-text > span {
            color: var(--ink-400);
            font-weight: 400;
        }

        .logo-region {
            font-size: 0.7rem;
            color: var(--ink-400);
            font-weight: 500;
        }

        nav {
            display: flex;
            gap: 1.25rem;
        }

        nav a {
            color: var(--ink-400);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 0.5rem;
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 3rem 1rem;
            margin-top: 4rem;
            text-align: center;
            color: var(--ink-500);
            font-size: 0.875rem;
        }

        /* Common Components */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background-color: var(--link-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: #245a85;
            transform: translateY(-1px);
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.green, .badge.status-good {
            background-color: var(--civic-green-bg);
            color: var(--civic-green);
        }

        .badge.yellow, .badge.status-watch {
            background-color: var(--civic-amber-bg);
            color: #8a5a00;
        }

        .badge.red, .badge.status-bad {
            background-color: var(--civic-red-bg);
            color: var(--civic-red);
        }

        .badge.none, .badge.status-none {
            background-color: var(--surface-muted);
            color: var(--ink-500);
        }

        .badge--local  { background: var(--link-blue-bg); color: var(--link-blue); }
        .badge--rapid     { background: var(--civic-green-bg); color: var(--civic-green); }
        .badge--express   { background: #f3e8ff; color: #7c3aed; }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .status-good, .green, .gap-pos, .faster, .improve {
            color: var(--civic-green);
        }

        .status-watch, .yellow, .onpace, .warn {
            color: #8a5a00;
        }

        .status-bad, .red, .gap-neg, .slower, .decline, .poor {
            color: var(--civic-red);
        }

        /* Shared Component Classes */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .page-title {
            font-size: 1.6rem;
            line-height: 1.2;
            color: var(--ink-900);
        }
        .page-subtitle {
            margin-top: 0.35rem;
            color: var(--ink-500);
            font-size: 0.9rem;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .metric-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            box-shadow: var(--shadow-sm);
        }
        .metric-label {
            color: var(--ink-500);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .metric-value {
            margin-top: 0.2rem;
            color: var(--ink-900);
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .filter-bar,
        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .filter-bar {
            margin-bottom: 1.5rem;
        }
        .filter-label,
        .control-label {
            color: var(--ink-500);
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .filter-pill,
        .filter-bar a,
        .control-row a {
            display: inline-flex;
            align-items: center;
            min-height: 2rem;
            padding: 0.35rem 0.75rem;
            margin: 0.25rem 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink-700);
            font-size: 0.84rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
        .filter-pill:hover,
        .filter-bar a:hover,
        .control-row a:hover {
            border-color: var(--link-blue);
            color: var(--link-blue);
        }
        .filter-pill.active,
        .filter-bar a.active,
        .control-row a.active {
            background: var(--link-blue);
            border-color: var(--link-blue);
            color: white;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .data-table th {
            padding: 0.5rem 0.75rem;
            text-align: left;
            color: var(--ink-500);
            background: var(--surface-muted);
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .data-table td {
            padding: 0.5rem 0.75rem;
            border-top: 1px solid var(--line-soft);
            font-size: 0.9rem;
        }
        .data-table tr:hover td {
            background: #fbfdff;
        }
        .route-id {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--ink-900);
        }
        .empty-state {
            padding: 3rem 1rem;
            color: var(--ink-500);
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        @media (max-width: 720px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.8rem;
            }
            nav {
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            .container {
                padding: 1rem 0.5rem;
            }
            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        /* Specific blocks */
        {% block extra_head %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <div class="logo-icon">
                <svg width="34" height="34" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="4" y="5" width="34" height="32" rx="7" fill="currentColor"/>
                    <path d="M12 27L18 21L23 25L31 15" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 14H21" stroke="#8fd6bd" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="31" cy="15" r="3" fill="#f0b84b"/>
                </svg>
            </div>
            <span class="logo-text">Mobili<span>spect</span><span class="logo-region">{% block region_name %}{% endblock %}</span></span>
        </a>
        <nav>
            <a href="/" class="{% block nav_speed %}{% endblock %}">Speeds</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Mobilispect. Real-time performance monitoring for public transit.</p>
        <p style="margin-top: 0.5rem; font-size: 0.75rem; opacity: 0.7;">Data Source: STM & various GTFS-RT feeds</p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
