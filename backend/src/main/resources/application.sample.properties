# spring.data.mongodb.uri = mongodb+srv://user:password@cluster.mongodb.net/mobilispect?retryWrites=true&w=majority
logging.level.com.mobilispect.backend=TRACE
# Expose Swagger UI at /help
springdoc.swagger-ui.path=/help
spring.data.mongodb.database=
spring.data.mongodb.uri=

# Resilience4j - Retry Configuration
resilience4j.retry.instances.save.max-attempts=5
resilience4j.retry.instances.save.wait-duration=1s
resilience4j.retry.instances.save.exponential-backoff-multiplier=2

# Resilience4j - Transit.land API Rate Limiting (6 requests/second per their documentation)
resilience4j.ratelimiter.instances.transitland.limit-for-period=6
resilience4j.ratelimiter.instances.transitland.limit-refresh-period=1s
resilience4j.ratelimiter.instances.transitland.timeout-duration=30s
resilience4j.ratelimiter.instances.transitland.allow-health-indicator-to-fail=true
resilience4j.ratelimiter.instances.transitland.subscribe-for-events=true
resilience4j.ratelimiter.instances.transitland.event-consumer-buffer-size=100
