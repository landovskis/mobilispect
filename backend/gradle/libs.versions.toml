[versions]
arrow = "2.1.0"
kotlin = "2.3.0"
kotlinxCoroutines = "1.8.1"
kotlinxSerializationCSV = "2.0.0"
kotlinxSerialization = "1.9.0"
conveyalGtfs = "6.2.0"
gtfsRealtimeBindings = "0.0.8"
resilience4j = "2.2.0"
springBoot = "4.0.0"
springDependency = "1.1.7"
springModulith = "1.3.0"
springDoc = "2.6.0"
springDocPlugin = "1.9.0"
squareSortDependency = "0.14"
testcontainers = "1.20.4"

[libraries]

# Typed Errors
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }

# Concurrency
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines", version.ref = "arrow" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines"}
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Serialization
kotlinx-serialization-csv = { module = "de.brudaswen.kotlinx.serialization:kotlinx-serialization-csv", version.ref = "kotlinxSerializationCSV" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# GTFS Parsing
conveyal-gtfs = { module = "com.conveyal:gtfs-lib", version.ref = "conveyalGtfs" }
gtfs-realtime-bindings = { module = "com.google.transit:gtfs-realtime-bindings", version.ref = "gtfsRealtimeBindings" }

# Fault Tolerance
resilience4j-spring = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }

# Monitoring
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# Modular Monolith Architecture
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api" }
spring-modulith-runtime = { module = "org.springframework.modulith:spring-modulith-runtime" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# View OpenAPI
springdoc-openapi-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springDoc" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

[plugins]

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }

spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency = { id = "io.spring.dependency-management", version.ref = "springDependency" }

# Allow Generation of OpenAPI Schema
springdoc-openapi = { id = "org.springdoc.openapi-gradle-plugin", version.ref = "springDocPlugin" }

square-sortDependencies = { id = "com.squareup.sort-dependencies", version.ref = "squareSortDependency" }
