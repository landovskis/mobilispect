repos:
  - repo: local
    hooks:
      - id: backend-kotlin-tests
        name: Backend Kotlin Tests (Constitutional TDD Requirement)
        entry: bash -c './gradlew test'
        language: system
        files: '.*\.(kt|kts)$'
        exclude: '(build|\.gradle)/.*'
        pass_filenames: false

      - id: backend-kotlin-format
        name: Backend Kotlin Format (ktfmt)
        entry: bash -c './gradlew ktfmtFormat'
        language: system
        files: '.*\.kt$'
        exclude: '(build|\.gradle)/.*'
        pass_filenames: false

      - id: backend-kotlin-lint
        name: Backend Kotlin Lint (ktlint)
        entry: bash -c './gradlew ktlintCheck'
        language: system
        files: '.*\.kt$'
        exclude: '(build|\.gradle)/.*'
        pass_filenames: false

      - id: backend-kotlin-detekt
        name: Backend Kotlin Static Analysis (detekt)
        entry: bash -c './gradlew detekt'
        language: system
        files: '.*\.kt$'
        exclude: '(build|\.gradle)/.*'
        pass_filenames: false

      - id: backend-modulith-verify
        name: Spring Modulith Module Boundaries (Constitutional Principle VII)
        entry: bash -c './gradlew verifyModulith'
        language: system
        files: '.*\.kt$'
        exclude: '(build|\.gradle)/.*'
        pass_filenames: false
